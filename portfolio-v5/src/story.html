<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="en" href="{{altEn}}">
<link rel="alternate" hreflang="es" href="{{altEs}}">
<link rel="alternate" hreflang="x-default" href="{{altEn}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{canonical}}">
<link rel="icon" href="{{favicon}}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* No hay interfaz: el contenido está escrito en las cosas del cuarto (la base, la ventana, el pizarrón, un monitor, una nota, una calcomanía)
     y cada cosa se escribe con lo que le toca: gis, dedo sobre vidrio, monoespaciada, tinta. El scroll lleva la cámara de una a otra. */
  :root { --accent: #ffc46b; --hand: 'Caveat', 'Bradley Hand', 'Segoe Print', cursive; --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --sans: 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { background: #000; }
  body { margin: 0; color: #f4f1ea; font: 400 16px/1.4 var(--sans); -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .film { position: sticky; top: 0; height: 100svh; overflow: hidden; background: radial-gradient(ellipse at 50% 55%, #15111f 0%, #08060d 55%, #000 100%); }
  .dawn { position: absolute; inset: 0; background: radial-gradient(ellipse at 62% 38%, #6a4358 0%, #33213b 50%, #150e1c 100%); opacity: var(--dawn, 0); }
  .film > img { position: absolute; left: 50%; top: 50%; height: 100%; width: auto; aspect-ratio: 1; image-rendering: pixelated; transform: translate(-50%, -50%) scale(var(--poster, 1)); transition: opacity .5s; }
  .film.live > img { opacity: 0; }
  .lens { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); opacity: 0; transition: opacity .5s; }
  .film.live .lens { opacity: 1; }
  .lens canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .lens canvas.drag { cursor: grabbing; }

  /* lo escrito en el cuarto: cada bloque es HTML real, colocado en perspectiva sobre su superficie */
  .surf { position: absolute; left: 0; top: 0; transform-origin: 0 0; opacity: 0; visibility: hidden; pointer-events: none; will-change: transform, opacity; backface-visibility: hidden; }
  .surf a { pointer-events: auto; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 5px; }
  .surf a:hover { color: var(--accent); }
  .surf p, .surf h1, .surf h2, .surf ul { margin: 0; padding: 0; list-style: none; }

  /* el suelo delante del diorama: letras pintadas, acostadas */
  .plaque { display: grid; align-content: start; gap: 30px; color: #f1e6d2; text-transform: uppercase; white-space: nowrap; }
  .plaque h1 { font: 700 150px/.9 var(--sans); letter-spacing: .08em; }
  .plaque h2 { font: 700 100px/.95 var(--sans); letter-spacing: .02em; }
  .plaque p { font: 500 38px/1 var(--sans); letter-spacing: .12em; opacity: .8; }
  .plaque.ask p { text-transform: none; letter-spacing: .04em; font-size: 54px; opacity: 1; }
  .plaque a { text-decoration-thickness: 4px; text-underline-offset: 10px; }
  /* la ventana: escrito con el dedo en el vidrio */
  .glass { color: rgba(226, 238, 255, .94); font: 500 47px/1.08 var(--hand); text-shadow: 0 0 10px rgba(160, 200, 255, .55); text-wrap: balance; }
  /* el pizarrón: gis */
  .chalk { color: #f3efe4; font-family: var(--hand); padding: 22px 34px; }
  .chalk h2 { font: 500 30px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; opacity: .62; margin-bottom: 20px; font-size: 24px; }
  .chalk li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 24px; border-bottom: 2px dashed rgba(243, 239, 228, .22); padding: 4px 0 7px; }
  .chalk li a, .chalk li b { font-size: 48px; font-weight: 700; line-height: 1.02; text-decoration-thickness: 3px; }
  .chalk li span { font-size: 28px; opacity: .72; white-space: nowrap; }
  /* el monitor */
  .screen { background: #15294a; color: #d6e6ff; font: 500 23px/1.55 var(--mono); padding: 26px 28px; white-space: nowrap; }
  .screen .c { opacity: .55; }
  .screen b { color: var(--accent); font-weight: 500; }
  /* nota en el escritorio y calcomanía detrás del monitor: tinta sobre papel */
  .ink { color: #251a2c; font: 700 43px/1.02 var(--hand); padding: 12px 18px; text-wrap: balance; display: grid; align-content: center; }
  .ink.sticker { font-size: 62px; text-align: center; gap: 10px; }
  .ink.sticker small { font: 600 21px/1.2 var(--sans); letter-spacing: .04em; opacity: .75; }

  /* lo único que no está en el cuarto: un hilo de avance y la invitación a deslizar */
  .reel { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(244, 241, 234, .1); z-index: 3; }
  .reel i { display: block; height: 100%; background: var(--accent); transform-origin: 0 50%; transform: scaleX(var(--p, 0)); }
  .cue { position: absolute; left: 50%; bottom: clamp(18px, 5svh, 44px); z-index: 3; display: grid; justify-items: center; gap: 10px; transform: translateX(-50%); font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: rgba(244, 241, 234, .7); transition: opacity .4s; pointer-events: none; }
  .cue i { width: 1px; height: 36px; background: linear-gradient(#f4f1ea, transparent); animation: cue 1.8s ease-in-out infinite; transform-origin: top; }
  .cue.off { opacity: 0; }
  @keyframes cue { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

  .lang { position: absolute; right: clamp(14px, 3vw, 34px); top: calc(clamp(12px, 2.4svh, 26px) + env(safe-area-inset-top)); z-index: 4; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: rgba(244, 241, 234, .7); text-decoration: none; padding: 10px 6px; }
  .lang:hover { color: var(--accent); }

  /* sin 3D (sin WebGL o con ahorro de datos): el mismo contenido, como texto simple sobre la imagen fija */
  .plain { display: none; position: absolute; inset: auto 0 0; z-index: 4; padding: 22px 22px 30px; background: linear-gradient(transparent, rgba(0, 0, 0, .86) 30%); text-align: center; }
  .film.flat .plain { display: block; }
  .film.flat .cue { display: none; }
  .plain h1 { margin: 0 0 6px; font: 300 clamp(20px, 4vw, 34px)/1.2 var(--sans); letter-spacing: .2em; text-transform: uppercase; }
  .plain p { margin: 4px auto; max-width: 34em; color: rgba(244, 241, 234, .8); }

  .track div { height: 130svh; }
  .track { margin-top: -100svh; }
  .track div:first-child, .track div:last-child { height: 100svh; }
  .film.flat + .track { display: none; }
  @media (prefers-reduced-motion: reduce) { .cue i { animation: none; } .lens, .film > img { transition: none; } }
</style>
</head>
<body>
<main class="film" id="film">
  <div class="dawn" aria-hidden="true"></div>
  <img id="poster" src="{{POSTER}}" alt="{{posterAlt}}" width="{{side}}" height="{{side}}" decoding="async">
  <div class="lens" id="lens">
    <canvas id="room-canvas" aria-label="{{canvasLabel}}"></canvas>

    <!-- 0 · el suelo delante del diorama -->
    <div class="surf plaque" data-s="floor" data-beat="0" style="width:1440px;height:330px"><h1>{{name}}</h1><p>{{headline}}</p></div>
    <!-- 1 · la ventana -->
    <div class="surf glass" data-s="window" data-beat="1" style="width:420px;height:180px"><p>{{window}}</p></div>
    <!-- 2 · el pizarrón -->
    <div class="surf chalk" data-s="board" data-beat="2" style="width:780px;height:450px">
      <h2>{{boardTitle}}</h2>
      <ul>
        {{projects}}
      </ul>
    </div>
    <!-- 3 · el monitor de la derecha -->
    <div class="surf screen" data-s="screen" data-beat="3" style="width:490px;height:330px">
      {{stack}}
    </div>
    <!-- 4 · la nota junto al pato -->
    <div class="surf ink" data-s="note" data-beat="4" style="width:340px;height:160px"><p>{{note}}</p></div>
    <!-- 5 · la calcomanía detrás del monitor -->
    <div class="surf ink sticker" data-s="sticker" data-beat="5" style="width:450px;height:290px"><p>{{sticker}}</p><small>{{stickerSmall}}</small></div>
    <!-- 6 · otra vez el suelo -->
    <div class="surf plaque ask" data-s="floor" data-beat="6" style="width:1440px;height:330px"><h2>{{ask}}</h2><p>{{contact}}</p></div>
  </div>

  <div class="plain">
    <h1>{{name}}</h1>
    <p>{{headline}}. {{plain}}</p>
    <p>{{contact}}</p>
  </div>
  <a class="lang" href="{{otherHref}}" hreflang="{{otherLang}}" lang="{{otherLang}}">{{other}}</a>
  <div class="cue" id="cue">{{cue}}<i aria-hidden="true"></i></div>
  <div class="reel"><i id="reel"></i></div>
</main>
<div class="track" id="track" aria-hidden="true"><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>

<script>
(function () {
  const FIT0 = {{FIT}};
  const WORKER = '{{worker}}';
  const film = document.getElementById('film'), lens = document.getElementById('lens'), cv = document.getElementById('room-canvas');
  const track = document.getElementById('track'), reel = document.getElementById('reel'), cue = document.getElementById('cue');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(pointer: coarse)').matches;
  const N = track.children.length, HOLD = 0.5;

  /* en pantallas angostas la cámara se aleja para que el cuarto quepa a lo ancho */
  const fitFor = aspect => Math.max(FIT0, 1.3 / aspect);
  function layout() {
    const fit = fitFor(film.clientWidth / film.clientHeight);
    film.style.setProperty('--poster', (FIT0 / fit).toFixed(4));
    return fit;
  }
  layout();
  addEventListener('resize', layout);

  /* posición en la historia: de 0 a N-1; la parte decimal es el viaje hacia el siguiente plano */
  function position() {
    const kids = track.children, y = scrollY;
    let top = 0;
    for (let i = 0; i < kids.length - 1; i++) {
      const h = kids[i].offsetHeight;
      if (y < top + h) return i + (y - top) / h;
      top += h;
    }
    return N - 1;
  }
  function progress() {
    const c = position();
    reel.style.setProperty('--p', (c / (N - 1)).toFixed(4));
    cue.classList.toggle('off', c > 0.12);
    return c;
  }
  addEventListener('scroll', progress, { passive: true });
  progress();

  const flat = () => film.classList.add('flat');
  const conn = navigator.connection;
  if (conn && conn.saveData) return flat();
  const start = () => (window.requestIdleCallback || (f => setTimeout(f, 200)))(boot, { timeout: 1200 });
  if (document.readyState === 'complete') start(); else addEventListener('load', start, { once: true });

{{CLIENT}}
})();
</script>
</body>
</html>
