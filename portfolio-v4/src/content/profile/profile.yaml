  es: Estudiante de Inteligencia de Datos y Ciberseguridad · Cofundador y CTO
positioning:
  en: I build AI systems that do real work, as Co-Founder & CTO at Dopamina and iLuk.
  es: Construyo sistemas de IA que hacen trabajo real, como cofundador y CTO de Dopamina y de iLuk.
bio:
  en: >-
    At Dopamina, I turn a message into coordinated marketing work across content,
    publishing, community and ads. At iLuk, I build the orchestration layer for
    AI employees handling acquisition, onboarding, KYC, payments and collections.
    Both systems share the same standard: human direction, clear handoffs and
    infrastructure that keeps working.
  es: >-
    En Dopamina convierto un mensaje en trabajo coordinado de marketing para
    contenido, publicación, comunidad y anuncios. En iLuk construyo la capa de
    orquestación para empleados de IA que gestionan adquisición, onboarding, KYC,
    pagos y cobranza. Ambos sistemas comparten el mismo estándar: dirección humana,
    entregas claras e infraestructura que sigue funcionando.
