positioning:
  en: I build AI systems that do real work. Co-Founder & CTO at iLuk, with a background in backend engineering, iOS products and leading the teams behind them.
  es: Construyo sistemas de IA que hacen trabajo real. Cofundador y CTO de iLuk, con experiencia en ingeniería backend, productos iOS y liderazgo de equipos.
bio:
  en: >-
    I'm a software engineer and Co-Founder & CTO at iLuk, based in Mexico City.
    I build the infrastructure and orchestration behind AI employees, connecting
    acquisition, onboarding, KYC, payments and collections. Before iLuk, I co-founded
    Vyvo Tech, led hospitality engineering at Nyx Technology, and built mobile
    products with Universidad Panamericana's iOS Development Lab.
  es: >-
    Soy ingeniero de software y cofundador y CTO de iLuk, en la Ciudad de México.
    Construyo la infraestructura y la orquestación de empleados de IA, conectando
    adquisición, onboarding, KYC, pagos y cobranza. Antes de iLuk, cofundé Vyvo Tech,
    lideré ingeniería para hotelería en Nyx Technology y construí productos móviles
    en el iOS Development Lab de la Universidad Panamericana.
