name: Luis Cedillo Maldonado
shortName: Luis Cedillo
headline:
  en: Software engineer & tech lead
  es: Ingeniero de software y tech lead
positioning:
  en: I build backend systems and iOS products, and I lead the small teams that ship them — from a university lab serving 15,000 students to a hotel channel manager running in production.
  es: Construyo sistemas backend y productos iOS, y lidero los equipos pequeños que los entregan — desde un laboratorio universitario que sirve a 15,000 estudiantes hasta un channel manager hotelero corriendo en producción.
bio:
  en: >-
    I am a backend-leaning engineer from Mexico City. I care about systems that stay
    consistent under failure, interfaces people do not have to think about, and teams
    that ship on a rhythm. I have led iOS and backend projects at Universidad
    Panamericana's iOS Development Lab, built a channel manager for Marriott / City
    Express as tech lead at Nyx Technology, and automated operations for small
    businesses as a freelancer.
  es: >-
    Soy un ingeniero con inclinación backend, de la Ciudad de México. Me importan los
    sistemas que se mantienen consistentes ante fallas, las interfaces en las que la
    gente no tiene que pensar y los equipos que entregan con ritmo. He liderado
    proyectos iOS y backend en el iOS Development Lab de la Universidad Panamericana,
    construí un channel manager para Marriott / City Express como tech lead en Nyx
    Technology y automaticé operaciones para pequeños negocios como freelancer.
