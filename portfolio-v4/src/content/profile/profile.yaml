recognition:
  - kind: award
    title: { en: BimboNecta, es: BimboNecta }
    distinction: { en: 1st place nationally, es: Primer lugar nacional }
    context:
      en: "Swift Change Makers · Enactus México · May 2026"
      es: "Swift Change Makers · Enactus México · Mayo 2026"
    summary:
      en: "An iOS copilot for Grupo Bimbo's route salespeople, built with the iOS Development Lab UPMX. Shelf photos become practical sales guidance through on-device AI."
      es: "Un copiloto iOS para los vendedores de ruta de Grupo Bimbo, creado con el iOS Development Lab UPMX. Las fotos del anaquel se convierten en orientación práctica mediante IA en el dispositivo."
    details:
      en:
        - "Apple Vision and Foundation Models analyze shelf gaps, near-expiry stock and layout issues, with confidence scores for each suggestion."
        - "AI-assisted orders remain editable before syncing. Mexican Spanish voice input and local visit history keep the workflow useful while prioritizing privacy."
        - "Team: Luis Cedillo Maldonado, Rafael Nuñez Arellano and Daniel Emiliano Peláez Romero."
      es:
        - "Apple Vision y Foundation Models analizan faltantes, productos próximos a caducar y distribución del anaquel, con niveles de confianza para cada sugerencia."
        - "Los pedidos asistidos por IA se pueden editar antes de sincronizar. La entrada por voz en español de México y el historial local de visitas priorizan utilidad y privacidad."
        - "Equipo: Luis Cedillo Maldonado, Rafael Nuñez Arellano y Daniel Emiliano Peláez Romero."
